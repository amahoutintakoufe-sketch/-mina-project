<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مينا امغاد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Reem+Kufi:wght@500;700&family=Noto+Sans+Tifinagh&display=swap" rel="stylesheet">
<style>
:root{--night:#0E1431;--indigo:#1B2A6B;--indigo2:#25378C;--sand:#EBDDBB;--gold:#E3A72F;--ink:#F4EEDD;--mute:#9AA3C7;--line:#2B3772;--ok:#5FCB9A;--bad:#F0776B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;font-family:Tajawal,system-ui,sans-serif}
html,body{height:100%;background:var(--night);color:var(--ink)}
button{cursor:pointer;border:0;color:inherit;background:none;font-size:15px}
input,textarea{font-size:16px;color:var(--ink);background:var(--indigo);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;outline:none}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.scr{position:fixed;inset:0;display:none;flex-direction:column;background:var(--night);max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.scr.on{display:flex}
/* splash */
#splash{align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 38%,var(--indigo2),var(--night) 70%)}
.logo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 0 8px rgba(227,167,47,.18)}
.brand{font-size:34px;font-weight:800;color:var(--sand);letter-spacing:.5px}
.sub{color:var(--mute);font-size:14px}
.bar{width:170px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);animation:ld 2.6s ease-in-out forwards}
@keyframes ld{to{width:100%}}
@media(prefers-reduced-motion:reduce){.bar i{animation-duration:.1s}}
/* login */
#login{padding:28px 22px;gap:16px;overflow-y:auto}#login::before,#login::after{content:"";flex:1 0 0}
.demo{background:var(--indigo);border:1px dashed var(--gold);border-radius:12px;padding:12px;text-align:center;font-size:14px}.demo b{font-size:22px;color:var(--gold);letter-spacing:4px;direction:ltr;display:inline-block}
#login h1{font-size:26px;font-weight:800}
.tabs{display:flex;background:var(--indigo);border-radius:12px;padding:4px}
.tabs button{flex:1;padding:10px;border-radius:9px;color:var(--mute)}
.tabs button.on{background:var(--gold);color:#1a1300;font-weight:700}
.btn{background:var(--gold);color:#1a1300;font-weight:700;padding:14px;border-radius:12px;width:100%}
.btn.ghost{background:var(--indigo);color:var(--ink)}
.note{font-size:13px;color:var(--mute);line-height:1.7}
.otp{letter-spacing:14px;text-align:center;font-size:24px;direction:ltr}
.err{color:var(--bad);font-size:14px;min-height:20px}
.links{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.links h3{font-size:14px;color:var(--sand);font-weight:700}
.links a{display:flex;align-items:center;gap:10px;background:var(--indigo);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.links a .go{margin-inline-start:auto;color:var(--gold);font-weight:700;font-size:13px}.ab{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 14px}.ab img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}.ab b{font-size:20px;color:var(--sand)}.ab span{color:var(--mute);font-size:14px}.links.big a{padding:16px 14px;font-size:15px}
.links a small{color:var(--mute);display:block;font-size:12px}
.links a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* app */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
header b{font-size:20px;color:var(--sand)}
main{flex:1;overflow:auto;padding:14px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--indigo);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 4px;color:var(--mute);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--gold);font-weight:700}
nav svg{width:22px;height:22px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;width:100%;text-align:start}
.row:hover{background:var(--indigo)}
.av{width:46px;height:46px;border-radius:50%;background:var(--indigo2);display:grid;place-items:center;font-weight:800;color:var(--sand);flex:none}
.av.sq{border-radius:14px}
.meta{flex:1;min-width:0}
.meta b{display:block}
.meta span{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
h2{font-size:16px;margin:10px 0 8px;color:var(--sand)}
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;flex:none;width:64px}
.st .av{width:58px;height:58px;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--gold)}
.st.add .av{box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--line);font-size:26px}
.card{background:var(--indigo);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card p{font-size:14px;color:var(--mute);line-height:1.7}
.lock{font-size:12px;color:var(--ok);text-align:center;padding:6px}
/* chat */
#chat main{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;line-height:1.6;font-size:15px;word-break:break-word}
.me{background:var(--gold);color:#1a1300;align-self:flex-start;border-end-start-radius:4px}
.them{background:var(--indigo2);align-self:flex-end;border-end-end-radius:4px}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.compose button{background:var(--gold);color:#1a1300;border-radius:12px;padding:0 18px;font-weight:700}
.back{font-size:22px;padding:0 6px}
/* sheet / story viewer */
.sheet{position:fixed;inset:0;background:rgba(5,8,22,.7);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.sheet>div{background:var(--night);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:480px;max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:12px}
#viewer{align-items:center;justify-content:center}
#viewer .sc{width:min(92%,380px);aspect-ratio:9/14;border-radius:22px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;font-size:24px;font-weight:700;line-height:1.6;color:#fff;background:linear-gradient(160deg,var(--indigo2),#7b2f4f)}
.pick{display:block;background:var(--indigo);border:1px dashed var(--gold);border-radius:12px;padding:14px;text-align:center;cursor:pointer}
#sprev img,#sprev video{max-width:100%;max-height:170px;border-radius:12px;display:block;margin:auto}
.vtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500}
.vtop button{font-size:20px;padding:4px 8px}
.vmed{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;margin:10px 0;background:#000;display:grid;place-items:center}
.vmed img,.vmed video{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.shield{position:absolute;inset:0}
.vtxt{flex:1;display:grid;place-items:center;text-align:center}
.vcap{font-size:16px;font-weight:500;line-height:1.6;margin-bottom:8px}
.vreact{display:flex;justify-content:space-between;gap:4px}
.vreact button{font-size:26px;padding:6px;border-radius:12px;background:rgba(255,255,255,.12)}
.vreact button.on{background:var(--gold)}
.vstat{background:rgba(0,0,0,.35);border-radius:12px;padding:12px;font-size:15px}
#viewer .sc,#viewer .sc *{-webkit-touch-callout:none}
.cbtns{display:flex;gap:2px}.cbtns button{font-size:20px;padding:4px 7px}
#call{background:radial-gradient(circle at 50% 30%,var(--indigo2),var(--night) 75%);align-items:center;justify-content:space-between;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.cmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:0 24px}
.cav{width:124px;height:124px;font-size:48px;margin-bottom:8px}
#cn{font-size:24px;color:var(--sand)}#cstat{color:var(--mute)}#cnote{color:var(--mute);font-size:12px;margin-top:10px}
#lv{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-start:14px;width:96px;height:128px;object-fit:cover;border-radius:14px;border:2px solid var(--gold);transform:scaleX(-1);background:#000;z-index:2}
.ctrls{display:flex;gap:18px}.ctrls button{width:60px;height:60px;border-radius:50%;background:var(--indigo2);font-size:24px}
.ctrls button.off{background:#ffffff33;opacity:.6}.ctrls .end{background:var(--bad)}.ctrls .end{transform:rotate(135deg)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--sand);color:#1a1300;padding:11px 16px;border-radius:12px;font-size:14px;z-index:9;display:none;max-width:90%;text-align:center}

/* ===== عالم ليلة الصحراء ===== */
:root{--night:#0F0A2E;--indigo:rgba(255,255,255,.08);--indigo2:rgba(138,108,255,.32);--sand:#F6E7C8;--gold:#F5B93A;--turq:#35D6C0;--line:rgba(255,255,255,.16);--mute:#B9B2DD;--ink:#FBF4E4}
html,body{background:#0B0724}
body{background:linear-gradient(180deg,#07051A 0%,#150E48 45%,#4A2273 80%,#B8486A 100%) fixed}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scr,#splash{background:transparent;z-index:1}
h1,h2,header b,.brand,#cn,.ab b{font-family:'Reem Kufi',Tajawal,sans-serif;font-weight:700}
#splash{overflow:hidden}
.dunes{position:absolute;inset-inline:0;bottom:0;width:100%;height:34%;z-index:-1}
.brand{font-size:46px;letter-spacing:1px;text-shadow:0 0 26px rgba(245,185,58,.55)}
.tf{font-family:'Noto Sans Tifinagh',sans-serif;color:var(--turq);font-size:20px;letter-spacing:4px;text-shadow:0 0 16px rgba(53,214,192,.6);margin-top:-12px}
.logo{box-shadow:0 0 0 9px rgba(245,185,58,.14),0 0 70px 12px rgba(245,185,58,.35),0 0 130px 36px rgba(53,214,192,.18);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-9px)}}
.bar{background:rgba(255,255,255,.15)}.bar i{background:linear-gradient(90deg,var(--turq),var(--gold))}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
header,nav{background:rgba(15,10,46,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
header{position:relative;border-bottom:0}
header::after{content:"";position:absolute;inset-inline:0;bottom:-6px;height:6px;opacity:.75;background:linear-gradient(135deg,var(--gold) 25%,transparent 25%) -6px 0/12px 6px,linear-gradient(225deg,var(--gold) 25%,transparent 25%) -6px 0/12px 6px;z-index:2}
nav button.on{color:var(--turq);text-shadow:0 0 14px rgba(53,214,192,.7)}
.btn{background:linear-gradient(135deg,#FFD36B,#F29B3A);border-radius:16px;box-shadow:0 8px 28px rgba(245,185,58,.32)}
.btn.ghost{background:var(--indigo);box-shadow:none;border:1px solid var(--line)}
input,textarea{border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px}
.av{background:linear-gradient(135deg,#6A4BE0,#C2477F);color:#fff}
.st .av{box-shadow:0 0 0 3px #1A1050,0 0 0 5px var(--turq),0 0 20px rgba(53,214,192,.55)}
.st.add .av{box-shadow:0 0 0 3px #1A1050,0 0 0 5px var(--line)}
.me{background:linear-gradient(135deg,#FFD36B,#F29B3A)}
.them{background:rgba(138,108,255,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
.lock{color:var(--turq)}
.sheet>div{background:rgba(20,13,60,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#call{background:radial-gradient(ellipse at 15% 18%,rgba(53,214,192,.38),transparent 55%),radial-gradient(ellipse at 85% 38%,rgba(194,71,127,.45),transparent 55%)}
.cav{box-shadow:0 0 0 10px rgba(255,255,255,.07),0 0 60px rgba(138,108,255,.6)}
.vfx{display:flex;gap:8px;overflow-x:auto;padding:0 16px 18px;max-width:100%;scrollbar-width:none}
.vfx button{flex:none;padding:9px 14px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:14px}
.vfx button.on{background:var(--turq);color:#06241F;font-weight:700;border-color:transparent}
.ctrls button.act{background:var(--turq);color:#06241F}
.vfx:not(.show){display:none}
.vbadge{background:rgba(245,185,58,.18);border:1px solid var(--gold);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--sand);margin-top:8px}
.ctrls{gap:12px}
</style>
</head>

/* voice changer */
let vc=null;
const VOICES=[['none','طبيعي'],['f2m','من فتاة إلى رجل'],['m2f','من رجل إلى فتاة'],['monster','وحش'],['robot','روبوت'],['echo','صدى']];
function Jungle(ctx){
  const sr=ctx.sampleRate,bt=.1,ft=.05,fl=Math.floor(ft*sr);
  const mk=f=>{const n=Math.floor(bt*sr),b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=f(i,n);return b};

  const src=b=>{const s=ctx.createBufferSource();s.buffer=b;s.loop=true;return s};
  const m=[src(down),src(down),src(up),src(up)],mg=m.map(()=>ctx.createGain());
  const g1=ctx.createGain(),g2=ctx.createGain(),d1=ctx.createDelay(),d2=ctx.createDelay();
  m.forEach((s,i)=>s.connect(mg[i]));mg[0].connect(g1);mg[2].connect(g1);mg[1].connect(g2);mg[3].connect(g2);
  g1.connect(d1.delayTime);g2.connect(d2.delayTime);
  const f1=src(fade),f2=src(fade),x1=ctx.createGain(),x2=ctx.createGain();x1.gain.value=0;x2.gain.value=0;f1.connect(x1.gain);f2.connect(x2.gain);
  const input=ctx.createGain(),output=ctx.createGain();
  input.connect(d1);input.connect(d2);d1.connect(x1);d2.connect(x2);x1.connect(output);x2.connect(output);
  const t=ctx.currentTime+.05,t2=t+bt-ft;
  m[0].start(t);m[1].start(t2);m[2].start(t);m[3].start(t2);f1.start(t);f2.start(t2);
  function setPitch(v){const a=Math.abs(v),u=v>0;mg[0].gain.value=mg[1].gain.value=u?0:1;mg[2].gain.value=mg[3].gain.value=u?1:0;g1.gain.value=g2.gain.value=.5*bt*a}
  setPitch(0);return{input,output,setPitch}}
function makeVC(stream){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC||!stream.getAudioTracks().length)return null;
  try{
    const ctx=new AC();ctx.resume();
    const src=ctx.createMediaStreamSource(new MediaStream(stream.getAudioTracks())),dest=ctx.createMediaStreamDestination();
    const bus=ctx.createGain(),mon=ctx.createGain();mon.gain.value=0;bus.connect(dest);bus.connect(mon);mon.connect(ctx.destination);
    const j=Jungle(ctx);let extra=[];
    const cut=()=>{try{src.disconnect()}catch(e){}try{j.output.disconnect()}catch(e){}extra.forEach(n=>{try{n.disconnect()}catch(e){}try{n.stop&&n.stop()}catch(e){}});extra=[]};
    const P={f2m:-.5,m2f:.8,monster:-.9};
    function set(k){cut();
      if(k in P){j.setPitch(P[k]);src.connect(j.input);
        if(k==='monster'){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;j.output.connect(lp);lp.connect(bus);extra.push(lp)}else j.output.connect(bus);return}
      if(k==='robot'){const g=ctx.createGain();g.gain.value=0;const o=ctx.createOscillator();o.frequency.value=70;o.connect(g.gain);o.start();src.connect(g);g.connect(bus);extra.push(g,o);return}
      if(k==='echo'){const d=ctx.createDelay(1);d.delayTime.value=.28;const fb=ctx.createGain();fb.gain.value=.4;src.connect(bus);src.connect(d);d.connect(fb);fb.connect(d);d.connect(bus);extra.push(d,fb);return}
      src.connect(bus)}
    set('none');
    return{set,mon,ctx,stream:dest.stream,close(){cut();try{ctx.close()}catch(e){}}}
  }catch(e){return null}}

let cs=null,ci=null,ct=null,cvid=false;
async function startCall(video){
  cvid=video;$('#cav').textContent=cur.n[0];$('#cn').textContent=cur.n;

const EM=['❤️','😂','😮','😢','👍','🔥'];let curSt=null;
function addStory(){
  let file=null;
  sheet(`<h2>قصة جديدة</h2><label class="pick" for="sf">📎 اختر صورة أو فيديو (حتى 30 ثانية)</label><input id="sf" type="file" accept="image/*,video/*" hidden><div id="sprev"></div><textarea id="stx" rows="3" placeholder="أضف نصاً (اختياري)"></textarea><p class="note">لا يظهر أي زر تنزيل في القصص، وتختفي بعد 24 ساعة.</p><button class="btn" id="sok">نشر القصة</button>`);

    const s={n:'أنا',t,media:file,views:[],react:{}};S.stories.unshift(s);$('#sheet').classList.remove('on');render();toast('تم نشر القصة');simulate(s)}}
function statTxt(s){const t=Object.values(s.react||{}).reduce((a,b)=>a+b,0);return '👁 '+s.views.length+' مشاهدة · '+t+' تفاعل'}

function viewStory(s){
  s.react=s.react||{};s.views=s.views||[];curSt=s;const own=s.n==='أنا';
  const m=s.media?`<div class="vmed">${s.media.type==='video'?`<video src="${s.media.url}" autoplay loop playsinline disablepictureinpicture disableremoteplayback controlslist="nodownload noplaybackrate nofullscreen"></video>`:`<img src="${s.media.url}" alt="" draggable="false">`}<div class="shield"></div></div>`:`<div class="vtxt">${esc(s.t)}</div>`;
  $('#vsc').innerHTML=`<div class="vtop"><span>${esc(s.n)} · قبل قليل</span><button data-vc aria-label="إغلاق">✕</button></div>${m}${s.media&&s.t?`<div class="vcap">${esc(s.t)}</div>`:''}${own?`<button class="vstat" id="vstat">${statTxt(s)}</button>`:`<div class="vreact">${EM.map(e=>`<button data-em="${e}" class="${s.mine===e?'on':''}" aria-label="تفاعل ${e}">${e}</button>`).join('')}</div>`}`;
  $('#viewer').classList.add('on')}
function closeV(){$('#viewer').classList.remove('on');$('#vsc').innerHTML='';curSt=null}
function showViewers(){const s=curSt;closeV();const rs=Object.entries(s.react||{});
  sheet(`<h2>مشاهدات القصة</h2><p class="note">${s.views.length} مشاهدة (نسخة تجريبية: المشاهدون أصدقاء افتراضيون)</p>${s.views.map(n=>`<div class="row"><div class="av">${esc(n[0])}</div><div class="meta"><b>${esc(n)}</b></div></div>`).join('')||'<p class="note">لا مشاهدات بعد.</p>'}<h2>التفاعلات</h2><p>${rs.map(([e,c])=>e+' '+c).join('   ')||'لا تفاعلات بعد.'}</p><button class="btn ghost" data-close>إغلاق</button>`)}
$('#viewer').onclick=e=>{
  if(e.target.id==='viewer'||e.target.closest('[data-vc]')){closeV();return}
  const em=e.target.closest('[data-em]');
  if(em&&curSt){const k=em.dataset.em;if(curSt.mine){curSt.react[curSt.mine]=Math.max(0,(curSt.react[curSt.mine]||1)-1)}curSt.mine=k;curSt.react[k]=(curSt.react[k]||0)+1;
    document.querySelectorAll('.vreact button').forEach(b=>b.classList.toggle('on',b===em));toast('أُرسل تفاعلك '+k)}
  if(e.target.closest('#vstat'))showViewers()};
$('#viewer').oncontextmenu=e=>e.preventDefault();
$('#rules').onclick=()=>sheet(`<h2>قواعد مينا امغاد</h2><div class="card"><p>١. لكل مستخدم رقم تسلسلي مميز لا يتكرر.<br>٢. لا يُعثر على أحد إلا بمعرفة رقمه التسلسلي.<br>٣. القصص تظهر للأصدقاء فقط وتختفي بعد 24 ساعة.<br>٤. كل مجموعة لها قواعدها ويمكن للمشرف إزالة المخالفين.<br>٥. الإساءة والابتزاز والانتحال تؤدي إلى الحظر.</p></div><button class="btn ghost" data-close>حسناً</button>`);
</script>
</body>
